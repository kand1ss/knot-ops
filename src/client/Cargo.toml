[package]
name = "knot-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["fs", "io-util", "process", "rt-multi-thread"] }
knot-core = { path = "../core" }
knot-proto = { path = "../proto" }
knot-grpc = { path = "../grpc" }
tonic = { version = "0.14.6", features = ["channel"] }
tracing = "0.1.44"
sysinfo = "0.39.3"
tokio-stream = "0.1.18"
thiserror = "2.0.18"

[target.'cfg(windows)'.dependencies]
windows-sys = "0.61.2"

[target.'cfg(unix)'.dependencies]
nix = { version = "0.31.3", features = ["signal"] }

[dev-dependencies]
tokio = { version = "1.52.3", features = [
  "rt",
  "macros",
  "time",
  "rt-multi-thread",
] }
tempfile = "3.27.0"
