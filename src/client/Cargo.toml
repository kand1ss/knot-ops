[package]
name = "knot-client"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]
async-trait = "0.1.89"
tokio = { version = "1.52.3", features = ["fs", "io-util", "process"] }
knot-transport = { path = "../transport" }
knot-core = { path = "../core" }
knot-protocol = { path = "../protocol" }
tracing = "0.1.44"
directories = "6.0.0"
sysinfo = "0.39.3"

[dev-dependencies]
tokio = { version = "1.52.3", features = [
  "rt",
  "macros",
  "time",
  "rt-multi-thread",
] }
serial_test = "3.5.0"
tempfile = "3.27.0"
