[licenses]
allow = [
  "MIT",
  "Apache-2.0",
  "MPL-2.0",
  "Apache-2.0 WITH LLVM-exception",
  "Unicode-DFS-2016",
  "Unicode-3.0",
  "BSD-3-Clause",
  "ISC",
  "Zlib",
  "0BSD",
]

[bans]
multiple-versions = "warn"

[advisories]
db-urls = ["https://github.com/rustsec/advisory-db"]

# TEMPORARY:
# h2 0.4.16 fixes RUSTSEC-2026-0258 but currently breaks the
# concurrent HTTP/2 multiplexing integration test.
# Remove this exception when the upstream regression is fixed.
ignore = [
  "RUSTSEC-2026-0258",
]

unmaintained = "all"

