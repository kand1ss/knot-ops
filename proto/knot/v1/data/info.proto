syntax = "proto3";

package knot.v1.data;

// Lifecycle state of an individual service.
enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_RUNNING = 1;
  SERVICE_STATUS_STOPPED = 2;
  SERVICE_STATUS_FAILED = 3;
  SERVICE_STATUS_STARTING = 4;
  SERVICE_STATUS_STOPPING = 5;
}

// Latest daemon-known state for an individual service.
message ServiceInfo {
  // Service name within its workspace.
  string name = 1;
  // Current lifecycle state.
  ServiceStatus status = 2;
  // Process ID when the runtime exposes one.
  optional uint32 pid = 3;
  // Elapsed running time in seconds.
  uint64 uptime_secs = 4;
  // Number of restarts since the current daemon state was established.
  uint32 restart_count = 5;

  // Optional runtime and user-facing service details.
  optional ServiceMetadata metadata = 6;

  // True when the service exists in the current workspace manifest, but its
  // running instance was started from a different ServiceSpec (spec hash mismatch).
  // Always false if `orphaned` is true.
  bool drifted = 7;

  // True when the running service exists in daemon state, but is no longer
  // declared in the current workspace manifest (service was removed from config).
  bool orphaned = 8;
}

// Additional details about a service that do not determine its lifecycle state.
message ServiceMetadata {
  // Service port when one is known.
  optional string port = 1;
  // Command used by the process runtime, when applicable.
  optional string command = 2;
  // User-defined labels associated with the service.
  repeated string tags = 3;
  // Exit status from the most recent process termination, when available.
  optional int32 last_exit_code = 4;

  // Forward-compatible service metadata.
  map<string, string> extra = 15;
}
