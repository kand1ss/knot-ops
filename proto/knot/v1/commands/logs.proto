syntax = "proto3";

package knot.v1.commands;

// Selects service logs to return or follow.
message LogsRequest {
  // Workspace containing the requested services.
  string workspace_id = 1;
  // Optional service name; omitted to select all workspace services.
  optional string name = 2;
  // Keeps the stream open for new log lines after the initial tail.
  bool follow = 3;
  // Maximum number of historical lines to return before following.
  uint32 tail = 4;
}

// Server-streamed event carrying log entries or stream lifecycle markers.
message LogsResponse {
  // Service that emitted the log payload or event.
  string service = 1;

  // Type of log response event.
  oneof event {
    // Batch of log entries emitted by the service.
    LogBatch batch = 2;
    // Marker indicating that historical tail entries have been fully delivered.
    TailComplete tail_complete = 3;
  }
}

// Collection of log entries transmitted in a single stream event.
message LogBatch {
  // Ordered sequence of log entries.
  repeated LogEntry entries = 1;
  // Number of log lines dropped due to rate-limiting or buffer overflow since the previous batch.
  uint32 dropped = 2;
}

// A single log line emitted by a service runtime.
message LogEntry {
  // Unmodified log message content.
  string message = 1;
  // Timestamp when the log line was generated, expressed in Unix milliseconds.
  uint64 timestamp_ms = 2;
}

// Marker event signaling that all requested historical log lines (`tail`) 
// have been sent. Subsequent events are real-time log updates when `follow` is true.
message TailComplete {}