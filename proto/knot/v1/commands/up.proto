syntax = "proto3";

package knot.v1.commands;

import "knot/v1/task/task.proto";
import "knot/v1/task/events.proto";

// Starts or restarts specified services to bring the runtime state into alignment
// with the committed state.
//
// Without `prune`, services that were removed from the workspace configuration become
// orphaned and remain running. Setting `prune` to true enables explicit cleanup of
// these orphaned services.
message UpRequest {
  // Identifier of the target workspace.
  string workspace_id = 1;

  // Optional list of service names to start or restart; an empty list selects the workspace default.
  repeated string services = 2;

  // Proves the client holds the up-to-date state (obtained from Handshake or Commit).
  // Ensures no concurrent updates occurred before initiating execution.
  string expected_revision = 3;

  // When true, stops and cleans up orphaned services that are no longer present in the workspace configuration.
  bool prune = 4;
}

// Server-streamed progress and terminal state for an Up command.
message UpResponse {
  oneof kind {
    // Event emitted when the Up task is accepted for processing.
    knot.v1.task.TaskAccepted accepted = 1;
    // Event emitted when the Up task execution is cancelled.
    knot.v1.task.TaskCancelled cancelled = 2;

    // Progress or status update event from a service.
    knot.v1.task.ServiceEvent event = 3;
    // Terminal event indicating that the Up command has finished executing.
    UpDone done = 4;
  }
}

// Terminal summary for a completed Up command.
message UpDone {
  // Number of services successfully started.
  uint32 started = 1;
  // Number of services already in the desired state.
  uint32 skipped = 2;
  // Number of services that failed to start.
  uint32 failed = 3;
}
