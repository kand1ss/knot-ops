syntax = "proto3";

package knot.v1.commands;

import "knot/v1/execution/execution.proto";

// Starts all services in a workspace or the requested subset.
message UpRequest {
  // Workspace whose services are started.
  string workspace_id = 1;
  // Optional service names to start; an empty list selects the workspace default.
  repeated string services = 2;
}

// Server-streamed progress and terminal state for an Up command.
message UpResponse {
  oneof event {
    knot.v1.execution.ExecutionPlan plan = 1;

    knot.v1.execution.TaskStarting task_starting = 2;
    knot.v1.execution.TaskSuccess task_success = 3;
    knot.v1.execution.TaskFailed task_failed = 4;
    knot.v1.execution.TaskSkipped task_skipped = 5;
    knot.v1.execution.TaskCancelled task_cancelled = 6;

    UpDone up_done = 7;
    UpCancelled up_cancelled = 8;
  }
}

// Terminal summary for a completed Up command.
message UpDone {
  // Number of services successfully started.
  uint32 started = 1;
  // Number of services already in the desired state.
  uint32 skipped = 2;
  // Number of services that failed to start.
  uint32 failed = 3;
}

// Terminal summary for an Up command cancelled before completion.
message UpCancelled {
  // Cancellation reason supplied by the requester or daemon.
  string reason = 1;
  // Number of services started before cancellation.
  uint32 started = 2;
  // Number of services stopped during rollback.
  uint32 stopped = 3;
}
