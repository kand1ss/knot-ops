syntax = "proto3";

package knot.v1.commands;

import "knot/v1/task/task.proto";
import "knot/v1/task/events.proto";

// Request to reconcile the runtime state of a workspace with its committed state.
message SyncRequest {
  // Identifier of the target workspace to synchronize.
  string workspace_id = 1;
}

// Server-streamed progress and terminal state for an Sync command.
message SyncResponse {
  oneof kind {
    knot.v1.task.TaskAccepted accepted = 1;
    knot.v1.task.TaskCancelled cancelled = 2;

    knot.v1.task.ServiceEvent event = 3;
    SyncDone done = 4;
  }
}

// Terminal summary for a completed Sync command.
message SyncDone {
  // Number of services successfully started.
  uint32 started = 1;
  // Number of services successfully stopped.
  uint32 stopped = 2;
  // Number of services that failed to start/stop.
  uint32 failed = 3;
}
