syntax = "proto3";

package knot.v1.commands;

import "google/protobuf/timestamp.proto";

// Lifecycle state of an individual service.
enum ServiceStatus {
  SERVICE_STATUS_UNSPECIFIED = 0;
  SERVICE_STATUS_RUNNING = 1;
  SERVICE_STATUS_STOPPED = 2;
  SERVICE_STATUS_FAILED = 3;
  SERVICE_STATUS_STARTING = 4;
  SERVICE_STATUS_STOPPING = 5;
}

// Latest daemon-known state for an individual service.
message ServiceSnapshot {
  // Service name within its workspace.
  string name = 1;
  // Current lifecycle state.
  ServiceStatus status = 2;
  // Process ID
  uint32 pid = 3;
  // Elapsed running time in seconds.
  uint64 uptime_secs = 4;

  // True when the service exists in the current workspace manifest, but its
  // running instance was started from a different ServiceSpec (spec hash mismatch).
  // Always false if `orphaned` is true.
  bool drifted = 5;

  // True when the running service exists in daemon state, but is no longer
  // declared in the current workspace manifest (service was removed from config).
  bool orphaned = 6;

  // Environment variables
  map<string, string> extra = 15;
}

message DaemonTask {
  string id = 1;
  string workspace_id = 2;
  google.protobuf.Timestamp started_at = 3;
}

// Requests the latest daemon-known status for services in a workspace.
message StatusRequest {
  // Workspace containing the requested services.
  string workspace_id = 1;
  // Optional service names; an empty list selects all workspace services.
  repeated string services = 2;
}

// Status information for the selected services.
message StatusResponse {
  // One entry for each service selected by the request.
  repeated ServiceSnapshot services = 1;
  // Currently active daemon tasks
  repeated DaemonTask tasks = 2;

  // True if at least one running service has spec drift compared to manifest.
  bool has_drifted = 10;
  // True if at least one running service is no longer present in the manifest.
  bool has_orphaned = 11;
}
