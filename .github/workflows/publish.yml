name: CD

on:
  push:
    tags: ["v[0-9]+.[0-9]+.[0-9]+"]

permissions:
  contents: write

jobs:
  build-rust:
    name: Rust / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            asset_name: knot-linux-x86_64
          - name: Linux ARM64
            os: ubuntu-latest
            target: aarch64-unknown-linux-gnu
            asset_name: knot-linux-aarch64
            use_cross: true
          - name: macOS ARM64
            os: macos-latest
            target: aarch64-apple-darwin
            asset_name: knot-macos-aarch64
          - name: Windows x86_64
            os: windows-latest
            target: x86_64-pc-windows-msvc
            asset_name: knot-windows-x86_64
    steps:
      - uses: actions/checkout@v7

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install cross
        if: matrix.use_cross
        uses: taiki-e/install-action@cross

      - name: Build
        shell: bash
        run: make build-rust TARGET=${{ matrix.target }} CROSS=${{ matrix.use_cross && '1' || '0' }}

      - name: Prepare Assets
        id: prepare
        uses: ./.github/actions/prepare-assets
        with:
          asset_name: ${{ matrix.asset_name }}
          bin_name: knot

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ steps.prepare.outputs.asset_path }}
          if-no-files-found: error

  build-go:
    name: Go / ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: components/knotd
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x86_64
            os: ubuntu-latest
            goos: linux
            goarch: amd64
            asset_name: knotd-linux-x86_64
          - name: Linux ARM64
            os: ubuntu-latest
            goos: linux
            goarch: arm64
            asset_name: knotd-linux-aarch64
          - name: macOS ARM64
            os: macos-latest
            goos: macos
            goarch: arm64
            asset_name: knotd-macos-aarch64
          - name: Windows x86_64
            os: windows-latest
            goos: windows
            goarch: amd64
            asset_name: knotd-windows-x86_64
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - name: Build
        run: make build-go GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }}

      - name: Prepare Assets
        id: prepare
        uses: ./.github/actions/prepare-assets
        with:
          asset_name: ${{ matrix.asset_name }}
          bin_name: knotd

      - name: Upload Artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.asset_name }}
          path: ${{ steps.prepare.outputs.asset_path }}
          if-no-files-found: error


  publish:
    needs: [ build-rust, build-go ]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Download Artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist/
          merge-multiple: true

      - name: Extract Changelog
        id: changelog
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          NOTES=$(awk "/^## \[$VERSION\]/{flag=1; next} /^## \[/{flag=0} flag" CHANGELOG.md)
          NOTES=$(echo "$NOTES" | sed -e 's/^[[:space:]]*//' -e 's/[[:space:]]*$//')
          if [ -z "$NOTES" ]; then
            NOTES="Release $VERSION"
          fi
          echo "notes<<EOF" >> $GITHUB_OUTPUT
          echo "$NOTES" >> $GITHUB_OUTPUT
          echo "EOF" >> $GITHUB_OUTPUT

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          body: ${{ steps.changelog.outputs.notes }}
          files: dist/**
          generate_release_notes: true

      - name: Install cargo-release
        if: "!contains(github.ref_name, '-')"
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-release

      - name: Publish to crates.io
        if: "!contains(github.ref_name, '-')"
        run: make publish-rust CARGO_TOKEN=${{ secrets.CARGO_TOKEN }}
